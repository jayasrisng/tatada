<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2723" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <meta name="description" content="A travel notebook that turns plans into approved actions. Trips, tasks, memories, and help from Fo." />
    <title>tatada · less managing, more traveling</title>
    <script>
      // Apply the theme before first paint: saved choice, else the system setting.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('tatada:theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f5ef')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
