project_id = "tatada"
[functions.tatada-api]
verify_jwt = false
entrypoint = "./functions/tatada-api/index.ts"
[functions.tatada-events]
verify_jwt = false
entrypoint = "./functions/tatada-events/index.ts"
[db.migrations]
schema_paths = ["./schemas/*.sql"]

# Mirrors the manual hosted settings for the private ten-tester prototype.
[auth]
enable_signup = false
minimum_password_length = 12
[auth.email]
# Keep email/password provider enabled; global signup and DB admission are closed.
enable_signup = true
enable_confirmations = true
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
